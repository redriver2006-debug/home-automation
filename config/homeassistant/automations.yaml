- id: '1787724647320'
  alias: ESPresense node offline alert
  description: Telegram alert when either ESPresense BLE node drops off MQTT for more
    than 5 minutes, and again when it returns. Driven by the connectivity binary sensors
    (MQTT last-will), so it needs no recorder history.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.espresense_gate2_connectivity
    - binary_sensor.espresense_living_room_connectivity_2
    to: 'off'
    for:
      minutes: 5
    id: offline
  - trigger: state
    entity_id:
    - binary_sensor.espresense_gate2_connectivity
    - binary_sensor.espresense_living_room_connectivity_2
    from: 'off'
    to: 'on'
    for:
      minutes: 1
    id: online
  conditions: []
  actions:
  - action: shell_command.telegram_gate_presence_test_text
    data:
      text: '{% set n = ''Gate'' if ''gate'' in trigger.entity_id else ''Living Room''
        %}{% if trigger.to_state.state == ''off'' %}ALERT: ESPresense {{ n }} node
        offline for 5+ minutes{% else %}RECOVERED: ESPresense {{ n }} node back online{%
        endif %}'
  mode: queued
  max: 4
- id: '1787731877596'
  alias: Gate Arrival Pending Set On BLE Return
  description: Backup arrival detection for when iOS geofencing is late or silent.
    Sets the arrival flag when the gate node sees the phone again after the living
    room node has not seen it for 15+ minutes - an unambiguous went-away-and-came-back
    signal that does not depend on GPS.
  triggers:
  - trigger: state
    entity_id: binary_sensor.ble_person_a_gate_nearby
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.gate_arrival_pending
    state: 'off'
    note: Do not re-arm a flag that is already set.
  - condition: template
    value_template: '{% set tl = states(''input_datetime.ble_person_a_living_last_seen'')
      %} {{ tl in [''unknown'',''unavailable'',''''] or (as_timestamp(now()) - as_timestamp(tl))
      >= 900 }}'
    note: The indoor node has not seen the phone for 15+ minutes, so this is a genuine
      return rather than moving around the house.
  - condition: template
    value_template: '{% set t = states(''input_datetime.gate_presence_last_notify'')
      %} {{ t in [''unknown'',''unavailable'',''''] or (as_timestamp(now()) - as_timestamp(t))
      >= 900 }}'
    note: Do not re-arm within 15 minutes of the gate having just been opened.
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.gate_arrival_pending
  mode: single
