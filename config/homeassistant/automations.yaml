- id: presence_three_way_mismatch_start_log
  alias: Presence Three-Way Mismatch Start Log
  description: Log when BLE, Geofence, and HomeKit presence become inconsistent
  trigger:
  - platform: template
    value_template: "{{\n  (is_state('binary_sensor.ble_phone_home','on') | int)\n
      \ + (is_state('person.person_a','home') | int)\n  + (is_state('input_boolean.person_a_is_home','on')
      | int)\n  not in [0, 3]\n}}"
  action:
  - service: logbook.log
    data:
      name: Presence Consistency
      message: MISMATCH START | BLE={{ states('binary_sensor.ble_phone_home') }} |
        Geofence={{ states('person.person_a') }} | HomeKit={{ states('input_boolean.person_a_is_home')
        }}
      entity_id: input_boolean.person_a_is_home
  mode: single
- id: presence_three_way_mismatch_resolved_log
  alias: Presence Three-Way Mismatch Resolved Log
  description: Log when BLE, Geofence, and HomeKit presence become consistent again
  trigger:
  - platform: template
    value_template: "{{\n  (is_state('binary_sensor.ble_phone_home','on') | int)\n
      \ + (is_state('person.person_a','home') | int)\n  + (is_state('input_boolean.person_a_is_home','on')
      | int)\n  in [0, 3]\n}}"
  action:
  - service: logbook.log
    data:
      name: Presence Consistency
      message: MISMATCH RESOLVED | BLE={{ states('binary_sensor.ble_phone_home') }}
        | Geofence={{ states('person.person_a') }} | HomeKit={{ states('input_boolean.person_a_is_home')
        }}
      entity_id: input_boolean.person_a_is_home
  mode: single
- id: gate_arrival_pending_set_on_home
  alias: Gate Arrival Pending Set On Home
  description: Set arrival pending only on a fresh geofence arrival so already-home
    BLE scans cannot reopen the gate
  trigger:
  - platform: state
    entity_id: person.person_a
    from: not_home
    to: home
  condition:
  - condition: state
    entity_id: input_boolean.gate_arrival_pending
    state: 'off'
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.gate_arrival_pending
  mode: single
- id: gate_arrival_pending_clear_on_away
  alias: Gate Arrival Pending Clear On Away
  description: Clear arrival pending when geofence and BLE both away
  trigger:
  - platform: state
    entity_id: person.person_a
  - platform: state
    entity_id: binary_sensor.ble_phone_home
  condition:
  - condition: state
    entity_id: person.person_a
    state: not_home
  - condition: state
    entity_id: binary_sensor.ble_phone_home
    state: 'off'
  action:
  - service: input_boolean.turn_off
    target:
      entity_id: input_boolean.gate_arrival_pending
  mode: single
- id: ble_person_b_seen_update
  alias: BLE Person B Seen Update
  trigger:
  - platform: mqtt
    topic: espresense/devices/person_b-iphone/gate
    id: gate
  - platform: mqtt
    topic: espresense/devices/person_b-iphone/living_room
    id: living
  action:
  - choose:
    - conditions: '{{ trigger.id == ''gate'' }}'
      sequence:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ble_person_b_gate_last_seen
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - condition: template
        value_template: '{{ trigger.payload_json is defined and trigger.payload_json.distance
          is defined }}'
      - service: input_number.set_value
        target:
          entity_id: input_number.ble_person_b_gate_distance
        data:
          value: '{{ trigger.payload_json.distance | float(99) }}'
    - conditions: '{{ trigger.id == ''living'' }}'
      sequence:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ble_person_b_living_last_seen
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - condition: template
        value_template: '{{ trigger.payload_json is defined and trigger.payload_json.distance
          is defined }}'
      - service: input_number.set_value
        target:
          entity_id: input_number.ble_person_b_living_distance
        data:
          value: '{{ trigger.payload_json.distance | float(99) }}'
  mode: single
