  alias: Outdoor Light Auto-Off Safety Net (10 min, Daytime Only)
  description: 'Daytime-only safety net: turns Outdoor Light off if it has been on
    continuously for 10 minutes during the day, when the night motion automation isn''t
    managing it. Does not apply at night so continuous evening use (e.g. BBQing near
    the light) is not cut off.'
