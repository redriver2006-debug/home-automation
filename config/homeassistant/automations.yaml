- id: '1784786914620'
  alias: Fujitsu AC Night Setback
  description: After 11:30pm (until 7am), if no motion is detected in the Dining Room
    for 10 minutes AND the outdoor temperature is below 15C, set the Fujitsu AC to
    heat 16C. Only runs while the Fujitsu Night Setback switch is on. Skipped on mild/warm
    nights.
  triggers:
  - trigger: state
    entity_id: binary_sensor.dining_room_occupancy
    to: 'off'
    for: 00:10:00
  conditions:
  - condition: state
    entity_id: input_boolean.fujitsu_night_setback
    state: 'on'
  - condition: time
    after: '23:30:00'
    before: 07:00:00
  - condition: numeric_state
    entity_id: sensor.temp_outdoor_temperature
    below: 15
  actions:
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.fujitsu_ac_fujitsu_ac
    data:
      hvac_mode: heat
  - action: climate.set_temperature
    target:
      entity_id: climate.fujitsu_ac_fujitsu_ac
    data:
      temperature: 16
  mode: single
