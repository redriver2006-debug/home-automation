    state: 'on'
  actions:
  - action: shell_command.telegram_alarm_motion_hallway
  - action: shell_command.imessage_alarm_motion_hallway
  - action: script.alarm_intrusion_response
  mode: single
- id: alarm_motion_when_armed_alert_dining
  alias: Armed Status - Dining Room Motion Alert
  triggers:
  - entity_id: binary_sensor.dining_room_occupancy
    to: 'on'
    for: 00:00:02
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.alarm_bottom_armed
    state: 'on'
  actions:
  - action: shell_command.telegram_alarm_motion_dining
  - action: shell_command.imessage_alarm_motion_dining
  - action: script.alarm_intrusion_response
  mode: single
- id: alarm_motion_when_armed_alert_living
  alias: Armed Status - Living Room Motion Alert
  triggers:
  - entity_id: binary_sensor.living_room_occupancy
    to: 'on'
    for: 00:00:02
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.alarm_bottom_armed
    state: 'on'
  actions:
  - action: shell_command.telegram_alarm_motion_living
  - action: shell_command.imessage_alarm_motion_living
  - action: script.alarm_intrusion_response
  mode: single
- id: alarm_motion_when_armed_alert_cabinet
  alias: Cabinet Motion Alert
  description: Notify on Cabinet motion at all times; also run the full intrusion
    response (siren + lights) when the alarm is armed
  triggers:
  - trigger: state
    entity_id: binary_sensor.cabinet_occupancy
    to: 'on'
    for: 00:00:02
  actions:
  - action: shell_command.telegram_alarm_motion_cabinet
  - action: shell_command.imessage_alarm_motion_cabinet
  - if:
    - condition: state
      entity_id: input_boolean.alarm_bottom_armed
      state: 'on'
    then:
    - action: script.alarm_intrusion_response
