- id: outdoor_sensor_motion_turn_on_outdoor_light_night
  alias: Outdoor Sensor Motion -> Outdoor Light (60s extend)
  description: Any outdoor motion turns on outdoor light for 60s; continuous motion
    extends timer
  triggers:
  - entity_id: binary_sensor.outdoor_sensor_occupancy
    to: 'on'
    trigger: state
  - seconds: /15
    trigger: time_pattern
  conditions:
  - condition: sun
    after: sunset
    after_offset: -00:30:00
    before: sunrise
    before_offset: 00:30:00
  - condition: state
    entity_id: binary_sensor.outdoor_sensor_occupancy
    state: 'on'
  actions:
  - target:
      entity_id: light.outdoor_light
    data:
      brightness_pct: 100
      color_temp_kelvin: 6500
    action: light.turn_on
  - delay: 00:01:00
  - target:
      entity_id: light.outdoor_light
    action: light.turn_off
  mode: restart
