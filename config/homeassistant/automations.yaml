- id: alarm_motion_when_armed_alert_laundry
  alias: Armed Status - Laundry Room Motion Alert (Continuous Trigger)
  triggers:
  - entity_id: binary_sensor.laundry_occupancy
    to: 'on'
    for: 00:00:02
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.alarm_bottom_armed
    state: 'on'
  actions:
  - data:
      text: 'ALERT: Motion detected at Laundry Room'
    action: shell_command.telegram_gate_presence_test_text
  - action: script.alarm_intrusion_response
  mode: single
- id: alarm_front_gate_change_require_disarm
  alias: Front Door - Not Disarmed 60s After Open Alert
  description: While armed, if the Front Door opens (even briefly) and isn't disarmed
    within 60 seconds, send an alert
  triggers:
  - entity_id: binary_sensor.front_contact
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.alarm_bottom_armed
    state: 'on'
  - condition: template
    value_template: '{% set armed_changed = states.input_boolean.alarm_bottom_armed.last_changed
      %} {{ armed_changed is not none and (as_timestamp(now()) - as_timestamp(armed_changed))
      >= 60 }}'
  actions:
  - delay: 00:01:00
  - condition: state
    entity_id: input_boolean.alarm_bottom_armed
    state: 'on'
  - action: shell_command.telegram_front_gate_timeout_text
  - action: shell_command.imessage_front_gate_timeout_text
  mode: restart
- id: alarm_back_door_when_armed_alert
  alias: Back Door/Living Room Door - Armed Open Alert
  triggers:
  - entity_id:
    - binary_sensor.back_contact
    - binary_sensor.livingroom_contact
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.alarm_bottom_armed
    state: 'on'
  actions:
  - variables:
      door_name: '{% if trigger.entity_id == ''binary_sensor.back_contact'' %}Back
        Door{% else %}LivingRoom{% endif %}'
  - data:
      context: Door opened while armed
      doors: '{{ door_name }}'
    action: shell_command.dynamic_door_alert
  mode: single
- id: livingroom_door_open_night
  alias: Night Door Open Check 22:05
  description: 每天22:05检查所有门磁，若仍开门则每5分钟重复提醒，直到全部关闭
  triggers:
  - at: '22:05:00'
    trigger: time
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.sliding_gate_contact
      state: 'on'
    - condition: state
      entity_id: binary_sensor.front_contact
      state: 'on'
    - condition: state
      entity_id: binary_sensor.back_contact
      state: 'on'
    - condition: state
      entity_id: binary_sensor.livingroom_contact
      state: 'on'
  actions:
  - variables:
      doors: '{% set ns = namespace(items=[]) %} {% if is_state(''binary_sensor.sliding_gate_contact'',''on'')
        %}{% set ns.items = ns.items + [''Sliding Gate''] %}{% endif %} {% if is_state(''binary_sensor.front_contact'',''on'')
        %}{% set ns.items = ns.items + [''Front Door''] %}{% endif %} {% if is_state(''binary_sensor.back_contact'',''on'')
        %}{% set ns.items = ns.items + [''Back Door''] %}{% endif %} {% if is_state(''binary_sensor.livingroom_contact'',''on'')
        %}{% set ns.items = ns.items + [''LivingRoom''] %}{% endif %} {{ ns.items
        | join('', '') }}'
  - data:
      context: 22:05 doors still open
      doors: '{{ doors }}'
    action: shell_command.dynamic_door_alert
  - repeat:
      while:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.sliding_gate_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.front_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.back_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.livingroom_contact
          state: 'on'
      sequence:
      - delay: 00:05:00
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.sliding_gate_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.front_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.back_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.livingroom_contact
          state: 'on'
      - variables:
          doors: '{% set ns = namespace(items=[]) %} {% if is_state(''binary_sensor.sliding_gate_contact'',''on'')
            %}{% set ns.items = ns.items + [''Sliding Gate''] %}{% endif %} {% if
            is_state(''binary_sensor.front_contact'',''on'') %}{% set ns.items = ns.items
            + [''Front Door''] %}{% endif %} {% if is_state(''binary_sensor.back_contact'',''on'')
            %}{% set ns.items = ns.items + [''Back Door''] %}{% endif %} {% if is_state(''binary_sensor.livingroom_contact'',''on'')
            %}{% set ns.items = ns.items + [''LivingRoom''] %}{% endif %} {{ ns.items
            | join('', '') }}'
      - data:
          context: Night doors still open
          doors: '{{ doors }}'
        action: shell_command.dynamic_door_alert
  mode: restart
- id: armed_doors_still_open_check
  alias: After Arm - Check Non-Exit Doors Closed
  description: After arming, immediately check non-exit door sensors (Living Room/Back
    Door) for open doors; single message lists only doors still open
  triggers:
  - entity_id: input_boolean.alarm_bottom_armed
    to: 'on'
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: binary_sensor.livingroom_contact
      state: 'on'
    - condition: state
      entity_id: binary_sensor.back_contact
      state: 'on'
  actions:
  - variables:
      doors: '{% set ns = namespace(items=[]) %} {% if is_state(''binary_sensor.livingroom_contact'',''on'')
        %}{% set ns.items = ns.items + [''LivingRoom''] %}{% endif %} {% if is_state(''binary_sensor.back_contact'',''on'')
        %}{% set ns.items = ns.items + [''Back Door''] %}{% endif %} {{ ns.items |
        join('', '') }}'
  - data:
      context: Armed while non-exit doors open
      doors: '{{ doors }}'
    action: shell_command.dynamic_door_alert
  mode: single
- id: gate_presence_ble_gate_nearby_autounlock
  alias: Gate Presence BLE - Auto Open On Arrival
  description: 'Opens the sliding gate on arrival. Speed comes from MQTT triggers
    that re-evaluate on every ESPresense ping instead of waiting for a template tick.
    Safety comes from gate_arrival_pending being the single authority: set once per
    genuine arrival, cleared the moment the gate contact confirms it opened, so no
    number of BLE pings can reopen it while already home.'
  triggers:
  - trigger: mqtt
    topic: espresense/devices/person_a-iphone/gate
    id: ble_gate
    note: Fires on every ESPresense ping so arrival is evaluated within seconds, not
      on the once-a-minute template tick.
  - trigger: mqtt
    topic: espresense/devices/person_a-iphone/living_room
    id: ble_living
  - trigger: state
    entity_id: input_boolean.gate_arrival_pending
    to: 'on'
    id: pending
  - trigger: state
    entity_id:
    - binary_sensor.ble_person_a_gate_nearby
    - binary_sensor.ble_person_a_living_nearby
    from: 'off'
    to: 'on'
    id: nearby
  conditions:
  - condition: state
    entity_id: input_boolean.gate_presence_test_enabled
    state: 'on'
    note: Master kill switch - the BLE Auto Gate tile on the Security tab.
  - condition: state
    entity_id: input_boolean.gate_arrival_pending
    state: 'on'
    note: One-shot guard. Set once per genuine arrival, cleared on confirmed open.
      This is what prevents a false open while already at home.
  - condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(states.input_boolean.gate_arrival_pending.last_changed))
      <= 900 }}'
    note: A stale flag must not open the gate hours later.
  - condition: template
    value_template: '{% set tg = states(''input_datetime.ble_person_a_gate_last_seen'')
      %} {% set tl = states(''input_datetime.ble_person_a_living_last_seen'') %} {% set
      dg = states(''input_number.ble_person_a_gate_distance'') | float(99) %} {% set
      dl = states(''input_number.ble_person_a_living_distance'') | float(99) %} {% set
      rg = (tg not in [''unknown'',''unavailable'','''']) and ((as_timestamp(now())
      - as_timestamp(tg)) <= 45) %} {% set rl = (tl not in [''unknown'',''unavailable'',''''])
      and ((as_timestamp(now()) - as_timestamp(tl)) <= 45) %} {{ (rg and dg <= 10)
      or (rl and dl <= 10) }}'
    note: 'Freshness check, not a delay: the sighting must be no older than 45s and
      within 10m, on either node.'
  - condition: state
    entity_id: binary_sensor.sliding_gate_contact
    state: 'off'
  - condition: time
    after: 07:30:00
    before: '21:30:00'
  actions:
  - action: shell_command.doorbird_open_gate_relay1
    note: Open first - the arrival flag is only consumed once the gate confirms it
      moved.
  - wait_for_trigger:
    - trigger: state
      entity_id: binary_sensor.sliding_gate_contact
      to: 'on'
    timeout: 00:00:20
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: '{{ wait.completed }}'
    then:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.gate_arrival_pending
    - action: media_player.play_media
      target:
        entity_id: media_player.living_room
      data:
        media_content_id: http://192.168.1.10:8124/local/tts_local/person_a_is_home.mp3
        media_content_type: music
    - action: shell_command.telegram_gate_presence_test_text
      data:
        text: Gate opened on arrival (confirmed by gate contact).
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.gate_presence_last_notify
      data:
        datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    else:
    - action: shell_command.doorbird_open_gate_relay1
      note: No movement - retry the relay once.
    - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.sliding_gate_contact
        to: 'on'
      timeout: 00:00:20
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ wait.completed }}'
      then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.gate_arrival_pending
      - action: media_player.play_media
        target:
          entity_id: media_player.living_room
        data:
          media_content_id: http://192.168.1.10:8124/local/tts_local/person_a_is_home.mp3
          media_content_type: music
      - action: shell_command.telegram_gate_presence_test_text
        data:
          text: Gate opened on arrival (second attempt - first relay call produced
            no movement).
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.gate_presence_last_notify
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      else:
      - action: shell_command.telegram_gate_presence_test_text
        data:
          text: 'ALERT: gate did NOT open after two relay attempts. Arrival flag left
            set for retry. Check DoorBird relay and gate contact.'
        note: Flag deliberately left set so a later ping can retry.
  mode: single
  max_exceeded: silent
- id: gate_presence_ble_missed_attempt_diagnostics
  alias: Gate Presence BLE - Missed Attempt Diagnostics
  description: Log why auto-open did not fire when an arrival cycle stays pending
  trigger:
  - platform: state
    entity_id: input_boolean.gate_arrival_pending
    to: 'on'
    for: 00:00:20
  condition:
  - condition: state
    entity_id: input_boolean.gate_presence_test_enabled
    state: 'on'
  - condition: state
    entity_id: input_boolean.gate_arrival_pending
    state: 'on'
  action:
  - variables:
      tg: '{{ states(''input_datetime.ble_person_a_gate_last_seen'') }}'
      tl: '{{ states(''input_datetime.ble_person_a_living_last_seen'') }}'
      dg: '{{ states(''input_number.ble_person_a_gate_distance'') | float(99) }}'
      dl: '{{ states(''input_number.ble_person_a_living_distance'') | float(99) }}'
      rg: '{{ (tg not in [''unknown'',''unavailable'','''']) and ((as_timestamp(now())
        - as_timestamp(tg)) <= 45) }}'
      rl: '{{ (tl not in [''unknown'',''unavailable'','''']) and ((as_timestamp(now())
        - as_timestamp(tl)) <= 45) }}'
      near_ok: '{{ (rg and dg <= 10) or (rl and dl <= 10) }}'
      home_ok: '{{ is_state(''person.person_a'',''home'') or is_state(''input_boolean.person_a_is_home'',''on'')
        }}'
      gate_ok: '{{ is_state(''binary_sensor.sliding_gate_contact'',''off'') }}'
      time_ok: '{{ now().strftime(''%H:%M:%S'') >= ''07:30:00'' and now().strftime(''%H:%M:%S'')
        <= ''21:30:00'' }}'
      reasons: '{% set ns = namespace(items=[]) %} {% if not home_ok %}{% set ns.items
        = ns.items + [''home_not_confirmed''] %}{% endif %} {% if not near_ok %}{%
        set ns.items = ns.items + [''ble_not_recent_or_distance_gt_10m''] %}{% endif
        %} {% if not gate_ok %}{% set ns.items = ns.items + [''gate_contact_not_off=''
        ~ states(''binary_sensor.sliding_gate_contact'')] %}{% endif %} {% if not
        time_ok %}{% set ns.items = ns.items + [''outside_time_window''] %}{% endif
        %} {{ ns.items | join('', '') if ns.items else ''pending_but_reason_not_resolved''
        }}'
  - service: logbook.log
    data:
      name: Gate Presence BLE
      message: Missed auto-open while pending. reasons={{ reasons }} | person={{ states('person.person_a')
        }} | person_a_is_home={{ states('input_boolean.person_a_is_home') }} | gate_contact={{
        states('binary_sensor.sliding_gate_contact') }} | gate_last_seen={{ tg }}
        dist={{ dg }} | living_last_seen={{ tl }} dist={{ dl }}
      entity_id: input_boolean.gate_arrival_pending
  mode: single
- id: ble_phone_seen_update
  alias: BLE Person A Seen Update
  trigger:
  - platform: mqtt
    topic: espresense/devices/person_a-iphone/gate
    id: gate
  - platform: mqtt
    topic: espresense/devices/person_a-iphone/living_room
    id: living
  action:
  - choose:
    - conditions: '{{ trigger.id == ''gate'' }}'
      sequence:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ble_person_a_gate_last_seen
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - condition: template
        value_template: '{{ trigger.payload_json is defined and trigger.payload_json.distance
          is defined }}'
      - service: input_number.set_value
        target:
          entity_id: input_number.ble_person_a_gate_distance
        data:
          value: '{{ trigger.payload_json.distance | float(99) }}'
    - conditions: '{{ trigger.id == ''living'' }}'
      sequence:
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.ble_person_a_living_last_seen
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - condition: template
        value_template: '{{ trigger.payload_json is defined and trigger.payload_json.distance
          is defined }}'
      - service: input_number.set_value
        target:
          entity_id: input_number.ble_person_a_living_distance
        data:
          value: '{{ trigger.payload_json.distance | float(99) }}'
  - service: input_datetime.set_datetime
    target:
      entity_id: input_datetime.ble_phone_last_seen
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  mode: single
- id: ble_phone_arrival_record
  alias: BLE Phone Arrival Record
  trigger:
  - platform: state
    entity_id: binary_sensor.ble_phone_home
    from: 'off'
    to: 'on'
  action:
  - service: input_datetime.set_datetime
    target:
      entity_id: input_datetime.ble_phone_last_arrival
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  mode: single
- id: ble_phone_departure_record
  alias: BLE Phone Departure Record
  trigger:
  - platform: state
    entity_id: binary_sensor.ble_phone_home
    from: 'on'
    to: 'off'
  action:
  - variables:
      mins: "{% set a = states('input_datetime.ble_phone_last_arrival') %} {% if a
        in ['unknown','unavailable',''] %}\n  0\n{% else %}\n  {{ ((as_timestamp(now())
        - as_timestamp(a))/60) | round(1) }}\n{% endif %}"
  - service: input_datetime.set_datetime
    target:
      entity_id: input_datetime.ble_phone_last_departure
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  - service: input_text.set_value
    target:
      entity_id: input_text.ble_phone_last_stay_duration
    data:
      value: '{{ mins }} 分钟'
  mode: single
- id: ble_person_a_dual_node_departure_notify
  alias: BLE Person A Dual Node Departure Notify
  description: 测试：一块先检测到离家，立即检查另一块；若未离家则等待2分钟内变化，确认后立刻通知
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.ble_person_a_gate_nearby
    - binary_sensor.ble_person_a_living_nearby
    to: 'off'
    for: 00:01:00
  condition:
  - condition: state
    entity_id: input_boolean.gate_presence_test_enabled
    state: 'on'
  - condition: state
    entity_id: person.person_a
    state: home
  action:
  - condition: state
    entity_id: binary_sensor.ble_person_a_gate_nearby
    state: 'off'
  - condition: state
    entity_id: binary_sensor.ble_person_a_living_nearby
    state: 'off'
  - service: shell_command.telegram_gate_presence_test_text
    data:
      text: 已确认离家（gate+living_room均检测不到 Person A Iphone），不执行开门。
  mode: restart
- id: person_person_a_geofence_home_telegram_notify
  alias: Person Person A Geofence Home Telegram Notify
  description: Send Telegram immediately when person.person_a changes to home
