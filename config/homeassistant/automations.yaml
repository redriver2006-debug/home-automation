- id: study_co2_air_quality_alert
  alias: Study CO2 Air Quality Alert
  description: Notify Person A when Study CO2 crosses warning (1000ppm) or danger (2000ppm)
    thresholds, and when it returns to normal.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.study_study_carbon_dioxide
    above: 1000
    for: 00:05:00
    id: warning
  - trigger: numeric_state
    entity_id: sensor.study_study_carbon_dioxide
    above: 2000
    for: 00:05:00
    id: danger
  - trigger: numeric_state
    entity_id: sensor.study_study_carbon_dioxide
    below: 1000
    for: 00:05:00
    id: normal
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: warning
      - condition: not
        conditions:
        - condition: time
          after: 00:00:00
          before: 07:00:00
      sequence:
      - action: notify.send_message
        data:
          title: Study Air Quality
          message: CO2 is elevated at {{ states('sensor.study_study_carbon_dioxide')
            }} ppm — consider ventilating.
        target:
          entity_id: notify.person_a_iphone
    - conditions:
      - condition: trigger
        id: danger
      sequence:
      - action: notify.send_message
        data:
          title: Study Air Quality — High CO2
          message: CO2 is HIGH at {{ states('sensor.study_study_carbon_dioxide') }}
            ppm — ventilate now!
        target:
          entity_id: notify.person_a_iphone
    - conditions:
      - condition: trigger
        id: normal
      - condition: not
        conditions:
        - condition: time
          after: 00:00:00
          before: 07:00:00
      sequence:
      - action: notify.send_message
        data:
          title: Study Air Quality
          message: CO2 is back to normal at {{ states('sensor.study_study_carbon_dioxide')
            }} ppm.
        target:
          entity_id: notify.person_a_iphone
  mode: queued
  max: 5
