    id: toggle
  - trigger: state
    entity_id: event.bilresa_scroll_wheel_button_4
    not_from:
    - unavailable
    - unknown
    id: cooler
  - trigger: state
    entity_id: event.bilresa_scroll_wheel_button_5
    not_from:
    - unavailable
    - unknown
    id: warmer
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: brighter
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.room_2_light
        data:
          brightness_step_pct: 20
    - conditions:
      - condition: trigger
        id: dimmer
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.room_2_light
        data:
          brightness_step_pct: -20
    - conditions:
      - condition: trigger
        id: button_group_1
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''multi_press_1''
          }}'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: light.room_2_light
            state: 'off'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.room_2_light
            data:
              brightness_pct: 80
        default:
        - action: light.turn_off
          target:
            entity_id: light.room_2_light
    - conditions:
      - condition: trigger
        id: button_group_1
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''multi_press_2''
          }}'
      sequence:
      - variables:
          current_kelvin: '{{ state_attr(''light.room_2_light'', ''color_temp_kelvin'')
            | int(3200) }}'
      - action: light.turn_on
        target:
          entity_id: light.room_2_light
        data:
          color_temp_kelvin: "{% set cur = current_kelvin | int(3200) %} {% if cur
            < 2700 %}\n  3200\n{% elif cur < 3750 %}\n  4300\n{% elif cur < 5400 %}\n
            \ 6500\n{% else %}\n  2200\n{% endif %}"
    - conditions:
      - condition: trigger
        id: cooler
      sequence:
      - variables:
          current_kelvin: '{{ state_attr(''light.room_2_light'', ''color_temp_kelvin'')
            | int(3200) }}'
      - action: light.turn_on
        target:
          entity_id: light.room_2_light
        data:
          color_temp_kelvin: "{% set steps = [2200, 3200, 4300, 6500] %} {% set cur
            = current_kelvin | int(3200) %} {% if cur < 2700 %}\n  3200\n{% elif cur
            < 3750 %}\n  4300\n{% elif cur < 5400 %}\n  6500\n{% else %}\n  6500\n{%
            endif %}"
    - conditions:
      - condition: trigger
        id: warmer
      sequence:
      - variables:
          current_kelvin: '{{ state_attr(''light.room_2_light'', ''color_temp_kelvin'')
            | int(3200) }}'
      - action: light.turn_on
        target:
          entity_id: light.room_2_light
        data:
          color_temp_kelvin: "{% set cur = current_kelvin | int(3200) %} {% if cur
            > 5400 %}\n  4300\n{% elif cur > 3750 %}\n  3200\n{% elif cur > 2700 %}\n
            \ 2200\n{% else %}\n  2200\n{% endif %}"
- id: '1787538459923'
  alias: Fan CO2 - Turn On When High
  description: Turns the Xiaomi fan on at the configured speed and swing setting when
    CO2 in the selected room is above the ON threshold. Also re-checks immediately
    when the room, threshold, swing or Auto Mode is changed, so a room already over
    the limit is picked up without waiting for a fresh crossing.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.fan_co2_selected_room
    above: input_number.fan_co2_on_threshold
    for: 00:02:00
  - trigger: state
    entity_id:
    - input_select.fan_co2_room
    - input_number.fan_co2_on_threshold
  - trigger: state
    entity_id: input_boolean.fan_co2_auto
    to: 'on'
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: input_boolean.fan_co2_swing
  conditions:
  - condition: state
    entity_id: input_boolean.fan_co2_auto
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.fan_co2_selected_room
    above: input_number.fan_co2_on_threshold
  actions:
  - action: fan.turn_on
    target:
      entity_id: fan.xiaomi_fan
    data:
      percentage: '{{ states(''input_number.fan_co2_speed'') | int(50) }}'
  - delay: 00:00:03
  - action: fan.set_percentage
    target:
      entity_id: fan.xiaomi_fan
    data:
      percentage: '{{ states(''input_number.fan_co2_speed'') | int(50) }}'
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.fan_co2_swing
        state: 'on'
      sequence:
      - action: fan.oscillate
        target:
          entity_id: fan.xiaomi_fan
        data:
          oscillating: true
    default:
    - action: fan.oscillate
      target:
        entity_id: fan.xiaomi_fan
      data:
        oscillating: false
  mode: single
- id: '1787538472808'
  alias: Fan CO2 - Turn Off When Clear
  description: Turns the Xiaomi fan off when CO2 in the selected room is below the
    OFF threshold. Also re-checks when the room or threshold changes. The gap between
    the ON and OFF thresholds stops the fan cycling around a single value.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.fan_co2_selected_room
    below: input_number.fan_co2_off_threshold
    for: 00:05:00
  - trigger: state
    entity_id:
    - input_select.fan_co2_room
    - input_number.fan_co2_off_threshold
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.fan_co2_auto
    state: 'on'
  - condition: state
    entity_id: fan.xiaomi_fan
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.fan_co2_selected_room
    below: input_number.fan_co2_off_threshold
  actions:
  - action: fan.turn_off
    target:
      entity_id: fan.xiaomi_fan
  mode: single
- id: '1787543524141'
  alias: Room 2 IKEA wheel - Fan control (group 3)
  description: BILRESA scroll wheel group 3 controls the Xiaomi standing fan. Wheel
    adjusts speed in 10% steps, single click toggles the fan, double click toggles
    oscillation. Group 1 and 2 remain assigned to the Room 2 light.
  triggers:
  - trigger: state
    entity_id: event.bilresa_scroll_wheel_button_7
    not_from:
    - unavailable
    - unknown
    id: speed_up
  - trigger: state
    entity_id: event.bilresa_scroll_wheel_button_8
    not_from:
    - unavailable
    - unknown
    id: speed_down
  - trigger: state
    entity_id: event.bilresa_scroll_wheel_button_9
    not_from:
    - unavailable
    - unknown
    id: button
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: speed_up
      sequence:
      - action: fan.increase_speed
        target:
          entity_id: fan.xiaomi_fan
        data:
          percentage_step: 10
    - conditions:
      - condition: trigger
        id: speed_down
      sequence:
      - action: fan.decrease_speed
        target:
          entity_id: fan.xiaomi_fan
        data:
          percentage_step: 10
    - conditions:
      - condition: trigger
        id: button
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''multi_press_1''
          }}'
      sequence:
      - action: fan.toggle
        target:
          entity_id: fan.xiaomi_fan
    - conditions:
      - condition: trigger
        id: button
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''multi_press_2''
          }}'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: fan.xiaomi_fan
            attribute: oscillating
            state: true
          sequence:
          - action: fan.oscillate
            target:
              entity_id: fan.xiaomi_fan
            data:
              oscillating: false
        default:
        - action: fan.oscillate
          target:
            entity_id: fan.xiaomi_fan
          data:
            oscillating: true
  mode: queued
  max: 25
- id: '1787638744201'
  alias: Water Valve 1 - Scheduled watering
  description: Opens outdoor valve 1 at its start time for the set duration, subject
    to the auto toggle and the date pattern. Also applies the set duration whenever
    the valve is opened by hand, so a manual toggle runs for the same length as Run
    now. The valve's own countdown closes it; a failsafe shuts it if it stays open
    past the maximum run length.
  triggers:
  - trigger: time
    at: input_datetime.water_valve_1_start_time
    id: start
  - trigger: state
    entity_id: switch.water_valve_1
    to: 'on'
    id: opened
  - trigger: state
    entity_id: switch.water_valve_1
    to: 'on'
    for: 02:05:00
    id: failsafe
  conditions: []
  actions:
  - choose:
    - alias: Start time reached - water for the set duration
      conditions:
      - condition: trigger
        id: start
      - condition: state
        entity_id: input_boolean.water_valve_1_auto
        state: 'on'
      - condition: or
        conditions:
        - condition: state
          entity_id: input_select.water_valve_1_dates
          state: Every day
        - condition: and
          conditions:
          - condition: state
            entity_id: input_select.water_valve_1_dates
            state: Odd dates
          - condition: template
            value_template: '{{ now().day % 2 == 1 }}'
        - condition: and
          conditions:
          - condition: state
            entity_id: input_select.water_valve_1_dates
            state: Even dates
          - condition: template
            value_template: '{{ now().day % 2 == 0 }}'
        - condition: and
          conditions:
          - condition: state
            entity_id: input_select.water_valve_1_dates
            state: Every other odd date
          - condition: template
            value_template: '{{ now().day % 4 == 1 }}'
        - condition: and
          conditions:
          - condition: state
            entity_id: input_select.water_valve_1_dates
            state: Every other even date
          - condition: template
            value_template: '{{ now().day % 4 == 2 }}'
      sequence:
      - action: number.set_value
        target:
          entity_id: number.water_valve_1_countdown
        data:
          value: '{{ states(''input_number.water_valve_1_duration'') | int(15) }}'
      - delay:
          seconds: 2
      - action: switch.turn_on
        target:
          entity_id: switch.water_valve_1
    - alias: Valve opened - apply the set duration
      conditions:
      - condition: trigger
        id: opened
      sequence:
      - action: number.set_value
        target:
          entity_id: number.water_valve_1_countdown
        data:
          value: '{{ states(''input_number.water_valve_1_duration'') | int(15) }}'
    - alias: Failsafe - valve open too long
      conditions:
      - condition: trigger
        id: failsafe
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.water_valve_1
  mode: queued
  max: 5
