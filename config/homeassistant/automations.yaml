- id: doorbell_ring_notification
  alias: DoorBird Doorbell iMessage Alert
  description: When doorbell is pressed, send iMessage with snapshot only
  trigger:
  - platform: state
    entity_id: event.gate_doorbell
  action:
  - service: shell_command.imessage_doorbell_ring_snapshot
  - service: mqtt.publish
    data:
      topic: zigbee2mqtt/Siren/set
      payload: '{"alarm":true,"melody":3,"volume":"high","duration":10}'
  - delay: 00:00:05
  - service: mqtt.publish
    data:
      topic: zigbee2mqtt/Siren/set
      payload: '{"alarm":false}'
  mode: single
- id: handle_open_gate_action
  alias: Handle Gate Open Button
  triggers:
  - event_type: mobile_app_notification_action
    event_data:
      action: OPEN_GATE
    trigger: event
  actions:
  - action: shell_command.doorbird_open_gate_relay1
  - data:
      message: ✅ Gate opened
    action: notify.send_message
    target:
      entity_id: notify.person_a_iphone
  mode: single
- id: sliding_gate_open_watchdog_alert
  alias: Sliding Gate Open Watchdog Alert
  description: When gate opens, log event; alert after 60s if still open; then repeat
    every 5 minutes until closed
  trigger:
  - platform: state
    entity_id: binary_sensor.sliding_gate_contact
    to: 'on'
  condition:
  - condition: state
    entity_id: input_boolean.sliding_gate_watchdog_enabled
    state: 'on'
  action:
  - service: logbook.log
    data:
      name: Sliding Gate
      message: Sliding gate contact opened; starting 60-second check and 5-minute
        repeat alerts
      entity_id: binary_sensor.sliding_gate_contact
  - delay: 00:01:00
  - condition: state
    entity_id: input_boolean.sliding_gate_watchdog_enabled
    state: 'on'
  - condition: state
    entity_id: binary_sensor.sliding_gate_contact
    state: 'on'
  - service: shell_command.telegram_private_text
    data:
      message: "\U0001F6A8 Sliding Gate has been open for more than 60 seconds. Please
        check whether it should be closed."
  - service: shell_command.imessage_sliding_gate_60s
  - repeat:
      while:
      - condition: state
        entity_id: binary_sensor.sliding_gate_contact
        state: 'on'
      - condition: state
        entity_id: input_boolean.sliding_gate_watchdog_enabled
        state: 'on'
      sequence:
      - delay: 00:05:00
      - condition: state
        entity_id: input_boolean.sliding_gate_watchdog_enabled
        state: 'on'
      - condition: state
        entity_id: binary_sensor.sliding_gate_contact
        state: 'on'
      - service: shell_command.telegram_private_text
        data:
          message: "\U0001F6A8 Sliding Gate is still open (over 60 seconds). Please
            check whether it should be closed."
      - service: shell_command.imessage_sliding_gate_repeat
  mode: restart
- id: sliding_gate_watchdog_nightly_rearm
  alias: Sliding Gate Watchdog Nightly Rearm
  description: Re-enable the sliding gate watchdog every night; if the gate is still
    open, alert once and restore watchdog protection
  trigger:
  - platform: time
    at: '22:00:00'
  action:
  - service: input_boolean.turn_on
    target:
      entity_id: input_boolean.sliding_gate_watchdog_enabled
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.sliding_gate_contact
        state: 'on'
      sequence:
      - service: logbook.log
        data:
          name: Sliding Gate
          message: Nightly check found the gate still open; watchdog re-enabled and
            alert sent
          entity_id: binary_sensor.sliding_gate_contact
      - service: shell_command.telegram_gate_presence_test_text
        data:
          text: '⚠️ Nightly check: Sliding Gate is still open. I have re-enabled the
            watchdog.'
      - service: shell_command.imessage_sliding_gate_repeat
    default:
    - service: logbook.log
      data:
        name: Sliding Gate
        message: Nightly check re-enabled the watchdog
        entity_id: input_boolean.sliding_gate_watchdog_enabled
  mode: single
- id: alarm_bottom_single_press_arm
  alias: Alarm Button - Single Click Arm
  triggers:
  - topic: zigbee2mqtt/Alarm Button
    trigger: mqtt
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json.action | default('''') == ''single''
      }}'
  actions:
  - target:
      entity_id: input_boolean.alarm_bottom_armed
    action: input_boolean.turn_on
  - action: shell_command.telegram_alarm_armed_text
  - action: shell_command.imessage_alarm_armed_text
  mode: single
- id: alarm_bottom_double_press_disarm
  alias: Alarm Button - Double Click Disarm
  triggers:
  - topic: zigbee2mqtt/Alarm Button
    trigger: mqtt
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json.action | default('''') == ''double''
      }}'
  actions:
  - target:
      entity_id: input_boolean.alarm_bottom_armed
    action: input_boolean.turn_off
  - action: shell_command.telegram_alarm_disarmed_text
  - action: shell_command.imessage_alarm_disarmed_text
  mode: single
- id: alarm_motion_when_armed_alert_hallway
